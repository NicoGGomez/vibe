<!DOCTYPE html>
<html lang="es">
<head>
    
    <!-- sacar dsp -->
    <meta name="google" content="notranslate"> 
    <!--  -->

    <!-- metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- info general -->
    <title>Vibe - Contacto</title>
    <link rel="icon" href="Imgs/logo-vibe.png" type="image/png">

    <!-- estilos -->
    <link rel="stylesheet" href="Styles/Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
</head>
<body>

    <!-- nav -->

    <nav-bar class="cont"></nav-bar>

    <!-- mensaje error -->

    <div id="msg-error" class="error" style="display: none;"></div>

    <!-- bread crumb -->

    <bread-crumb links='Home,Nosotros,Contacto'></bread-crumb>

    <!-- seccion contacto -->

    <img src="Imgs/contacto.png" alt="">

    <!-- form -->

    <section class="contacto">

        <div class="contacto-contenido">

            <!-- informacion -->

            <div class="contacto-info">

                <span class="contacto-tag">
                    <i class="fa-solid fa-envelope"></i>
                    CONTACTO
                </span>

                <h1>
                    Hablemos.
                </h1>

                <p>
                    ¿Tenés alguna consulta, sugerencia o simplemente querés
                    decirnos algo? Completá el formulario y nos pondremos
                    en contacto con vos.
                </p>

            </div>


            <!-- formulario -->

            <div class="contacto-card">

                <div class="contacto-card-header">

                    <h2>Enviá tu mensaje</h2>

                    <p>
                        Te responderemos lo antes posible.
                    </p>

                </div>


                <form id="contactForm">

                    <div class="input">

                        <label for="nombreInput">
                            Nombre
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                name="nombre"
                                id="nombreInput"
                                placeholder="Tu nombre"
                                required
                            >

                        </div>

                    </div>


                    <div class="input">

                        <label for="mailInput">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                name="email"
                                id="mailInput"
                                placeholder="tuemail@gmail.com"
                                required
                            >

                        </div>

                    </div>


                    <div class="input input-msg">

                        <label for="msgInput">
                            Mensaje
                        </label>

                        <div class="input-wrapper textarea-wrapper">

                            <i class="fa-regular fa-message"></i>

                            <textarea
                                name="message"
                                id="msgInput"
                                placeholder="Escribí tu mensaje..."
                                required
                            ></textarea>

                        </div>

                    </div>


                    <button
                        type="submit"
                        id="btnEnviar"
                    >
                        <span>Enviar mensaje</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <p
                        id="form-message"
                        class="form-message"
                    ></p>

                </form>

            </div>

        </div>

    </section>

    <div class="separador"></div>

    <!-- footer -->

    <footer-comp class="cont"></footer-comp>

    <!-- link a scripts -->

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="Scripts/EnvioMensaje.js"></script>
    <script src="Components/BreadCrumb.js"></script>
    <script src="Components/Footer.js"></script>

    <script type="module" src="Components/NavBar.js"></script>

</body>
</html>
