<!DOCTYPE html>
<html lang="es">
<head>
    
    <!-- sacar dsp -->
    <meta name="google" content="notranslate"> 
    <!--  -->

    <!-- metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- info general -->
    <title>Vibe - Perfil</title>
    <link rel="icon" href="Imgs/logo-vibe.png" type="image/png">

    <!-- estilos -->
    <link rel="stylesheet" href="Styles/Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
</head>
<body>

    <!-- nav -->

    <nav-bar class="cont"></nav-bar>

    <!-- mensaje error -->

    <div id="msg-error" class="error" style="display: none;"></div>

    <!-- seccion perfil -->

    <main class="contenedor-perfil">

        <div class="perfil-card">

            <div class="perfil-avatar">

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="cont-info-perfil">

                <h1 id="nombre-usuario">
                    Mi perfil
                </h1>

                <p id="rol-usuario">
                    Usuario
                </p>

            </div>

        </div>


        <div class="perfil-acciones">

            <a
                id="link-compras"
                class="btn-perfil btn-compras"
                href="misCompras.html"
            >

                <i class="fa-solid fa-bag-shopping"></i>

                <span>
                    Mis compras
                </span>

            </a>

            <a
                id="link-favoritos"
                class="btn-perfil btn-favoritos"
                href="#favoritos"
            >
                <i class="fa-solid fa-heart"></i>

                <span>
                    Mis favoritos
                </span>
            </a>

            <button
                id="btn-logout"
                class="btn-perfil btn-logout"
                type="button"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    Cerrar sesión
                </span>

            </button>

        </div>

        <section id="favoritos" class="seccion-favoritos">

            <div class="titulo-favoritos">
                <i class="fa-solid fa-heart"></i>

                <h2>Mis favoritos</h2>
            </div>

            <p id="mensaje-favoritos" class="mensaje-favoritos">
                Cargando favoritos...
            </p>

            <div
                id="lista-favoritos"
                class="lista-favoritos"
            ></div>

        </section>

        <section
            id="seccion-mas-solicitados"
            class="seccion-mas-solicitados"
            style="display: none;"
        >

            <div class="titulo-mas-solicitados">

                <i class="fa-solid fa-fire"></i>

                <h2>Lo más solicitado</h2>

            </div>

            <p
                id="mensaje-mas-solicitados"
                class="mensaje-mas-solicitados"
            >
                Cargando productos...
            </p>

            <div
                id="lista-mas-solicitados"
                class="lista-mas-solicitados"
            ></div>

        </section>

    </main>

    <!-- footer -->

    <footer-comp class="cont"></footer-comp>

    <!-- link a scripts -->

    <script type="module" src="Scripts/logut.js"></script>
    <script src="Components/Footer.js"></script>
    <script type="module" src="Components/Card.js"></script>
    <script type="module" src="Scripts/perfil.js"></script>
    <script type="module" src="Components/NavBar.js"></script>
</body>
</html>
